name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values only. Tests use MongoMemoryServer and skip live AI/email.
# See .github/CI.md for the full contract.
env:
  CI: true
  NODE_ENV: test
  JWT_SECRET: ci-test-jwt-secret-not-for-production
  FRONTEND_URL: https://medharevision.shopcampuskart.in
  VITE_BACKEND_URL: https://medharevisionapi.shopcampuskart.in
  MONGO_URI: mongodb://127.0.0.1:27017/medha-ci
  CLOUDINARY_CLOUD_NAME: ci-placeholder
  CLOUDINARY_API_KEY: ci-placeholder
  CLOUDINARY_API_SECRET: ci-placeholder
  IMAGEKIT_PUBLIC_KEY: ci-placeholder
  IMAGEKIT_PRIVATE_KEY: ci-placeholder
  IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci
  OCRSPACE_API_KEY: ci-placeholder
  GROQ_API_KEY: ci-placeholder
  GEMINI_API_KEY: ci-placeholder
  SERP_API_KEY: ci-placeholder
  HOSTINGER_MAIL_API_TOKEN: ci-placeholder
  MAIL_FROM_ADDRESS: medharevision@codelearnn.com
  MAIL_FROM_NAME: Medha Revision
  APP_BASE_URL: https://medharevision.shopcampuskart.in

jobs:
  frontend:
    name: Frontend production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medha-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          working-directory: medha-frontend
          node-version: "22"
      - name: Lint
        run: npm run lint
      - name: Production unit tests
        run: npm run test:run
      - name: Production build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://medharevisionapi.shopcampuskart.in

  backend:
    name: Backend production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medha-backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-app
        with:
          working-directory: medha-backend
          node-version: "22"
      - name: Cache MongoMemoryServer binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongoms
      - name: Auth, API, security, OAuth tests
        run: npm run test:prod

  ci-result:
    name: CI result
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in needs.items() if job.get("result") in ("failure", "cancelled")]
          if failed:
              print("failed jobs:", ", ".join(failed))
              sys.exit(1)
          print("frontend and backend production checks passed")
          PY
